<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechStore — Gestão de Loja de Eletrônicos</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
    <h1>TechStore — Loja de Eletrônicos</h1>
    <nav id="tabs">
        <button class="tab-btn active" data-entity="produtos">Produtos</button>
        <button class="tab-btn" data-entity="pedidos">Pedidos</button>
        <button class="tab-btn" data-entity="clientes">Clientes</button>
        <button class="tab-btn" data-entity="categorias">Categorias</button>
        <button class="tab-btn" data-entity="fornecedores">Fornecedores</button>
    </nav>
</header>

<main>
    <div id="feedback" class="feedback hidden" role="alert"></div>

    <section class="card">
        <h2 id="form-title">Novo Registro</h2>
        <form id="entity-form"></form>
    </section>

    <section class="card">
        <div class="list-header">
            <h2 id="list-title">Registros</h2>
            <span id="loading-indicator" class="loading hidden">Carregando...</span>
        </div>
        <div class="table-responsive">
            <table>
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        <p id="empty-state" class="empty-state hidden">Nenhum registro cadastrado.</p>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
